<!doctype html>
<html lang="en" data-time="morning" data-glass="frost">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Adelia Tiara · Product Designer & AI Product Engineer</title>
    <meta name="description" content="Adelia Tiara designs and builds AI products and interactive websites end to end. Based in Bekasi, Indonesia (UTC+7), open to remote roles abroad." />
    <meta name="theme-color" content="#e4f7fd" />
    <meta name="color-scheme" content="light" />
    <meta name="author" content="Adelia Tiara" />
    <link rel="canonical" href="https://adelia.cc/" />
    <meta property="og:title" content="Adelia Tiara · Product Designer & AI Product Engineer" />
    <meta property="og:description" content="A glass bento for the quick read, and a room for the long one." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://adelia.cc/" />
    <meta property="og:image" content="https://adelia.cc/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      /* Before first paint: the room follows the clock in Bekasi (UTC+7), or the visitor's choice. */
      (function () {
        var t = 'morning';
        try {
          var saved = JSON.parse(sessionStorage.getItem('adelia.cc/v3') || '{}');
          if (saved.timeOverride) t = saved.timeOverride;
          else {
            var h = new Date(Date.now() + 7 * 36e5).getUTCHours();
            t = h >= 5 && h < 17 ? 'morning' : h >= 17 && h < 19 ? 'dusk' : 'night';
          }
          if (saved.glass) document.documentElement.dataset.glass = saved.glass;
        } catch (e) {}
        document.documentElement.dataset.time = t;
        if (location.pathname.indexOf('/room') === 0) document.documentElement.dataset.screen = 'room';
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.href = '/veil/' + t + '.webp';
        document.head.appendChild(l);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; max-width: 34em; margin: 4em auto; padding: 0 1em; color: #14213a; line-height: 1.55">
        <p><strong>Adelia Tiara</strong>, product designer and AI product engineer in Bekasi, Indonesia (UTC+7). Open to remote roles abroad.</p>
        <p>Email: <a href="mailto:aadeliatiara@gmail.com" style="color: #1c75bf">aadeliatiara@gmail.com</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

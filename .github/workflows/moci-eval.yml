# Typecheck and Moci's offline eval (25 cases) on every push, weekly, and on demand.
name: Moci eval

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run eval:moci
